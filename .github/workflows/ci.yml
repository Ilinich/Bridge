name: CI

# Manual only. Every run raises a macOS runner, which a private repository bills at ten times the
# Linux rate, and that is what exhausted the account's Actions budget. The pipeline is kept as it
# is: making the repository public restores free minutes on every runner, and the triggers can go
# back to push and pull_request unchanged.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: No upstream references
        run: ./scripts/check-no-upstream-refs.sh

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew allTests --no-daemon

      - name: Assemble
        run: ./gradlew :androidApp:assembleDebug --no-daemon

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The shared Compose UI tests only exist here: the Linux job disables every Apple target,
      # so on that runner the suite is skipped rather than run.
      - name: Native tests
        run: ./gradlew iosSimulatorArm64Test --no-daemon

      - name: Link framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
